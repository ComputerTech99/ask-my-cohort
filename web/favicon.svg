<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tab icon. Drawn as paths rather than text so it renders identically everywhere
       (favicons don't get webfonts). The chevron reads as an "A" and as a rising
       trend line; the dot is the flagged student the advisor is meant to catch. -->
  <rect width="64" height="64" rx="14" fill="#111315"/>
  <path d="M18 46 L32 18 L46 46" fill="none" stroke="#E8C24A" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="41" r="4.5" fill="#D6350F"/>
</svg>
