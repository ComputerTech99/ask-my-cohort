<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask My Cohort</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=3">
<script>
  // Applied before first paint so a dark-mode user never sees a white flash. No stored
  // preference means follow the OS, which the stylesheet handles on its own.
  try {
    var t = localStorage.getItem("amc-theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) { /* storage blocked — fall back to prefers-color-scheme */ }
</script>
</head>
<body>
<div id="app"></div>
<!-- ?v= is a cache buster: bump it whenever app.js/api.js/styles.css change shape, so a
     normal refresh can't leave a demo running stale JS against renamed endpoints. -->
<script type="module" src="./app.js?v=3"></script>
</body>
</html>
